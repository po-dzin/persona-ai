services:
  - type: web
    name: persona-ai-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: INTEGRATION_MODE
        value: real
      - key: PROVIDER_REAL_CALLS_ENABLED
        value: "true"
      - key: FREE_DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: R2_ENDPOINT
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: NANO_BANANA_API_KEY
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: STABILITY_API_URL
        value: https://api.stability.ai/v2beta/stable-image/generate/sd3
      - key: BFL_API_KEY
        sync: false
      - key: BFL_API_BASE_URL
        value: https://api.bfl.ai/v1
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_MINIAPP_URL
        sync: false
      - key: PROVIDER_REQUEST_TIMEOUT_SECONDS
        value: "90"
    healthCheckPath: /healthz
