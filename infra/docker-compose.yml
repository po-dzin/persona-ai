version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_photo
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: bash -lc "pip install -r apps/api/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/api"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/live_photo
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: bash -lc "pip install -r workers/celery/requirements.txt && celery -A workers.celery.tasks worker --loglevel=INFO"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  beat:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: bash -lc "pip install -r workers/celery/requirements.txt && celery -A workers.celery.tasks beat --loglevel=INFO"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
