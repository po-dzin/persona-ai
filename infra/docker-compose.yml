version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: live_photo
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    command: bash -lc "pip install -r apps/api/requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --app-dir apps/api"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/live_photo
      REDIS_URL: redis://redis:6379/0
      APP_ENV: docker
      API_PORT: 8000
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    # tasks.py imports from app.core.db, app.adapters.r2_client → нужен полный apps/api/requirements.txt
    command: bash -lc "pip install -r apps/api/requirements.txt && celery -A workers.celery.tasks worker --loglevel=INFO --concurrency=2"
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app/apps/api
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/live_photo
      REDIS_URL: redis://redis:6379/0
      APP_ENV: docker
      SOURCE_RETENTION_HOURS: "48"
      RESULT_RETENTION_DAYS: "30"
    depends_on:
      - postgres
      - redis

  beat:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ../:/app
    # Beat только планировщик — не нужен DB доступ, но нужен Celery
    # ВАЖНО: запускать только один инстанс Beat (иначе дублирование задач)
    command: bash -lc "pip install -r apps/api/requirements.txt && celery -A workers.celery.tasks beat --loglevel=INFO --scheduler celery.beat:PersistentScheduler"
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app/apps/api
      REDIS_URL: redis://redis:6379/0
      APP_ENV: docker
      SOURCE_RETENTION_HOURS: "48"
      RESULT_RETENTION_DAYS: "30"
    depends_on:
      - redis
