name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate-api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: personai_test
          POSTGRES_USER: personai
          POSTGRES_PASSWORD: personai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U personai -d personai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Tests run against real PostgreSQL so RLS enforcement is verified.
      # Falls back to SQLite if TEST_DATABASE_URL is not set (conftest.py default).
      TEST_DATABASE_URL: postgresql://personai:personai@localhost:5432/personai_test
      DATABASE_URL: postgresql://personai:personai@localhost:5432/personai_test
      APP_ENV: test
      INTEGRATION_MODE: mock

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements.txt pytest

      - name: Wait for PostgreSQL
        run: |
          until pg_isready -h localhost -U personai -d personai_test; do
            echo "Waiting for postgres..."
            sleep 1
          done
        env:
          PGPASSWORD: personai

      - name: Apply SQL migrations
        run: python infra/db/migrate.py

      - name: Spec lint
        run: python scripts/spec_lint.py

      - name: API + domain tests (PostgreSQL)
        run: pytest

  validate-web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install web dependencies
        run: npm --prefix apps/web ci

      - name: Web pre-merge gates
        run: npm --prefix apps/web run check:premerge

  validate-admin-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install admin dependencies
        run: npm --prefix apps/admin ci

      - name: Admin pre-merge gates
        run: npm --prefix apps/admin run check:premerge
